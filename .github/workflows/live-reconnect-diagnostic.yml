# Transient-reconnect DIAGNOSTIC — real Flutter Web → LiveKit, dispatch-only.
#
# This is a SEPARATE, NON-BLOCKING workflow from `live-e2e.yml`: it is the only
# place that induces a transient network interruption, and it is intentionally
# kept out of the regression pipeline so its timing sensitivity can NEVER make
# the normal CI flaky. It runs on manual dispatch and when its OWN harness files
# change (a `push` trigger scoped to this workflow + the reconnect test only —
# never on unrelated pushes; a `push` trigger, unlike `workflow_dispatch`, works
# from a non-default branch). A red run here never fails CI, Live E2E or deploy.
#
# It proves (or honestly disproves) genuine SDK reconnection: two real LiveKit
# clients join the SAME room, then the LiveKit container is FROZEN with
# `docker compose pause` (SIGSTOP preserves the room in memory — unlike
# restart/stop, which delete it) for a bounded window and resumed. The browser
# test (`app/test/e2e/livekit_reconnect_e2e_test.dart`) observes the real
# RoomReconnecting → RoomReconnected lifecycle through the production adapter and
# FAILS loudly if it never occurs (it never falls back to a fake).
#
# Everything runs on the ephemeral runner and is torn down with it; no production
# service is touched. Secrets are generated fresh and thrown away.
name: Live Reconnect Diagnostic (real LiveKit)

on:
  workflow_dispatch:
  push:
    branches:
      - claude/quranic-education-app-prototype-gkzle8
    paths:
      - ".github/workflows/live-reconnect-diagnostic.yml"
      - "app/test/e2e/livekit_reconnect_e2e_test.dart"

permissions:
  contents: read

concurrency:
  group: live-reconnect-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconnect:
    name: Transient reconnect (real LiveKit)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NODE_ENV: development
      LOG_LEVEL: info
      CORS_ORIGINS: ""
      LIVE_MEDIA_PROVIDER: livekit
      LIVE_ROOM_NAME_PREFIX: live-ci-reconnect-
      LIVEKIT_VERSION: "1.13.7"
      LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_API_KEY: ci_reconnect_key
      POSTGRES_USER: institution
      POSTGRES_DB: institution
      E2E_OWNER_EMAIL: owner@e2e.test
      E2E_BASE_URL: http://127.0.0.1:3000
      # A SECOND participant: two independent clients are required to observe one
      # surviving the other through the interruption.
      E2E_PARTICIPANT_EMAIL: participant-b@e2e.test
      E2E_PARTICIPANT_NAME: "E2E Participant B"

    steps:
      - uses: actions/checkout@v4

      - name: Configure runner-temp paths
        run: |
          {
            echo "COMPOSE_FILE=infra/compose.yaml:infra/compose.data.yaml:$RUNNER_TEMP/compose.ci-rc.yaml"
            echo "E2E_OUTPUT_FILE=$RUNNER_TEMP/rc-provision.json"
            echo "E2E_DEFINES_FILE=$RUNNER_TEMP/rc-defines.json"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install app dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate ephemeral credentials
        run: |
          gen() { node -e 'process.stdout.write(require("crypto").randomBytes(48).toString("base64url"))'; }
          for name in JWT_SECRET STORAGE_SIGNING_SECRET LIVEKIT_API_SECRET \
                      POSTGRES_PASSWORD REDIS_PASSWORD E2E_OWNER_PASSWORD \
                      E2E_PARTICIPANT_PASSWORD; do
            value="$(gen)"
            echo "::add-mask::$value"
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
            export "$name=$value"
          done
          printf 'DATABASE_URL=postgresql://%s:%s@db:5432/%s\n' \
            "$POSTGRES_USER" "$POSTGRES_PASSWORD" "$POSTGRES_DB" >> "$GITHUB_ENV"
          printf 'REDIS_URL=redis://:%s@redis:6379\n' "$REDIS_PASSWORD" >> "$GITHUB_ENV"

      - name: Resolve the LiveKit advertised IP (runner's routable IPv4)
        run: |
          ip4="$(ip -4 -o addr show scope global up | awk '{print $4}' | cut -d/ -f1 | grep -vE '^127\.' | head -n1)"
          if [ -z "$ip4" ]; then
            echo "::error::no non-loopback IPv4 found on the runner for LIVEKIT_NODE_IP"
            exit 1
          fi
          echo "LIVEKIT_NODE_IP=$ip4" >> "$GITHUB_ENV"
          echo "selected LIVEKIT_NODE_IP=$ip4"

      - name: Write the CI-only Compose override (db port + LiveKit debug logs)
        run: |
          cat > "$RUNNER_TEMP/compose.ci-rc.yaml" <<'YAML'
          # CI-ONLY, EPHEMERAL — generated by live-reconnect-diagnostic.yml.
          services:
            db:
              ports:
                - "127.0.0.1:5432:5432"
            livekit:
              environment:
                LIVEKIT_LOGGING_LEVEL: "debug"
          YAML

      - name: Validate the merged Compose stack
        run: docker compose config --quiet

      - name: Start Postgres, Redis and LiveKit
        run: docker compose up -d --wait --wait-timeout 180 db redis livekit

      - name: Apply database migrations
        working-directory: backend
        run: DATABASE_URL="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB}" npm run db:migrate

      - name: Start the backend
        run: docker compose up -d --wait --wait-timeout 180 api

      - name: Bootstrap the owner account
        run: printf '%s\n' "$E2E_OWNER_PASSWORD" | docker compose exec -T api node dist/cli/bootstrap-owner.js --email "$E2E_OWNER_EMAIL" --name "E2E Owner"

      - name: Provision a live session (owner + a second participant)
        working-directory: backend
        run: |
          attempts=8
          for i in $(seq 1 "$attempts"); do
            if npm run --silent e2e:provision; then
              echo "provisioned on attempt $i"
              exit 0
            fi
            if [ "$i" -eq "$attempts" ]; then
              echo "::error::provisioning failed after $attempts attempts"
              exit 1
            fi
            echo "attempt $i failed; media provider may still be warming up — retrying in 8s"
            sleep 8
          done

      - name: Build the dart-define file (owner + participant B)
        run: |
          node -e '
            const fs = require("fs");
            const out = JSON.parse(fs.readFileSync(process.env.E2E_OUTPUT_FILE, "utf8"));
            if (!out.accessToken || !out.sessionId) {
              throw new Error("fixture output missing accessToken/sessionId");
            }
            if (!out.participantAccessToken || !out.participantUserId) {
              throw new Error("fixture output missing the second participant");
            }
            console.log("::add-mask::" + out.accessToken);
            console.log("::add-mask::" + out.participantAccessToken);
            const defines = {
              LIVEKIT_E2E_BASE_URL: process.env.E2E_BASE_URL,
              LIVEKIT_E2E_ACCESS_TOKEN: out.accessToken,
              LIVEKIT_E2E_SESSION_ID: out.sessionId,
              LIVEKIT_E2E_ACCESS_TOKEN_B: out.participantAccessToken,
              LIVEKIT_E2E_USER_B: out.participantUserId,
            };
            fs.writeFileSync(process.env.E2E_DEFINES_FILE, JSON.stringify(defines), { mode: 0o600 });
            process.stderr.write("dart-define file written for session " + out.sessionId + " with two participants\n");
          '

      # The diagnostic itself. A background task freezes LiveKit mid-test with
      # `docker compose pause` (SIGSTOP — the room survives in memory) and resumes
      # it, while the browser test observes the real reconnect lifecycle. Timing:
      # ~40s lets both clients connect; the 25s freeze is long enough for the SDK
      # to detect loss and enter reconnecting, and resume is well within the SDK's
      # ~50s give-up window so the SAME room recovers. docker compose runs from the
      # repo root (COMPOSE_FILE paths are repo-root-relative); flutter runs in app/.
      # The freeze is ALWAYS lifted afterwards so teardown is clean.
      - name: Flutter Web → LiveKit transient-reconnect diagnostic
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          wrapper="$RUNNER_TEMP/chrome-rc"
          {
            echo '#!/usr/bin/env bash'
            echo "exec \"$CHROME_BIN\" \"\$@\" --disable-web-security --use-fake-ui-for-media-stream --use-fake-device-for-media-stream --autoplay-policy=no-user-gesture-required"
          } > "$wrapper"
          chmod +x "$wrapper"
          (
            sleep 40
            echo "::group::freeze livekit (docker compose pause — room preserved)"
            docker compose pause livekit
            echo "::endgroup::"
            sleep 25
            echo "::group::resume livekit (docker compose unpause)"
            docker compose unpause livekit
            echo "::endgroup::"
          ) &
          pauser=$!
          result=0
          ( cd app && CHROME_EXECUTABLE="$wrapper" flutter test test/e2e/livekit_reconnect_e2e_test.dart \
              --platform chrome \
              --dart-define-from-file="$E2E_DEFINES_FILE" ) || result=$?
          wait "$pauser" 2>/dev/null || true
          docker compose unpause livekit 2>/dev/null || true
          exit "$result"

      - name: Diagnostics
        if: always()
        run: |
          echo "== docker compose ps =="
          docker compose ps || true
          echo "== livekit logs (reconnect lifecycle) =="
          docker compose logs --no-color --tail 400 livekit || true

      - name: Tear down the ephemeral stack
        if: always()
        run: docker compose down -v --remove-orphans || true
