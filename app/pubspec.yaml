name: quran_institution_app
description: "Visual prototype (UI only) for the Global Institution for Teaching the Noble Quran."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  go_router: ^17.2.0
  flutter_riverpod: ^3.0.3
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  web_socket: ^1.0.1
  # Secure, persistent session tokens — iOS Keychain / Android Keystore-backed
  # storage so a signed-in device survives a cold restart (Sprint 19, ADR 0010).
  # A native plugin: consumed ONLY by lib/data/api/secure_token_store.dart
  # (test/auth/secure_token_store_boundaries_test.dart enforces the confinement).
  flutter_secure_storage: ^11.2.0
  # Live media provider (ADR 0030, P7b). Pinned EXACTLY — a bump is a deliberate
  # ADR change. Consumed ONLY by the future lib/data/media/livekit/ adapter; no
  # other Dart file may import it (test/live/live_boundaries_test.dart enforces).
  livekit_client: 2.13.0
  file_picker: ^13.1.0
  record: ^7.1.2
  just_audio: ^0.10.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Almarai
      fonts:
        - asset: assets/fonts/Almarai-Regular.ttf
          weight: 400
        - asset: assets/fonts/Almarai-Bold.ttf
          weight: 700
        - asset: assets/fonts/Almarai-ExtraBold.ttf
          weight: 800
    - family: PlexArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
          weight: 400
