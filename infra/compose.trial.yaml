# Isolated internal WEB TRIAL stack — fully separate from the Staging project
# (`institution`). Its own Compose project (`institution-trial`), its own private
# default network, its own database/redis/volumes and trial-only secrets. It
# reuses the already-built `institution-api` image (no app rebuild, no code
# duplication). Staging data is NEVER used.
#
#   docker compose -p institution-trial -f infra/compose.trial.yaml --env-file infra/env/trial.env up -d
#
# Served to the public only through the host nginx at https://trial.adlink4.com
# (web at /, API at /api, realtime at /realtime). trial-db and trial-redis are
# NOT published to any public interface; trial-db is bound to loopback only so
# host-run migrations can reach it.
name: institution-trial

services:
  trial-db:
    image: postgres:16
    environment:
      POSTGRES_USER: trial
      POSTGRES_PASSWORD: ${TRIAL_DB_PASSWORD:?set in infra/env/trial.env}
      POSTGRES_DB: trial
    volumes:
      - trial-pgdata:/var/lib/postgresql/data
    # Loopback only (not public): lets host-run drizzle migrations reach it.
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trial -d trial -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    security_opt: [no-new-privileges:true]

  trial-redis:
    image: redis:7
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${TRIAL_REDIS_PASSWORD:?set in infra/env/trial.env}
    volumes:
      - trial-redisdata:/data
    # Secret-safe readiness probe (same convention as the data-tier redis in
    # infra/compose.data.yaml): the password is read at run time from the
    # REDIS_PASSWORD env var via REDISCLI_AUTH, never placed in argv, `docker
    # inspect` Cmd, or logs — the $$ keeps compose from interpolating it.
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    security_opt: [no-new-privileges:true]

  trial-api:
    image: institution-api:latest
    depends_on:
      trial-db:
        condition: service_healthy
      trial-redis:
        condition: service_started
    environment:
      NODE_ENV: development          # isolated trial: fake live-media, no LiveKit dependency
      PORT: "3000"
      LOG_LEVEL: warn
      DATABASE_URL: postgresql://trial:${TRIAL_DB_PASSWORD}@trial-db:5432/trial
      REDIS_URL: redis://:${TRIAL_REDIS_PASSWORD}@trial-redis:6379
      JWT_SECRET: ${TRIAL_JWT_SECRET:?set in infra/env/trial.env}
      STORAGE_SIGNING_SECRET: ${TRIAL_STORAGE_SECRET:?set in infra/env/trial.env}
      STORAGE_LOCAL_ROOT: /app/.storage
      # Same-origin trial (web + API under trial.adlink4.com); this origin also
      # authorises the /realtime WebSocket (the server checks Origin itself).
      CORS_ORIGINS: https://trial.adlink4.com
    volumes:
      - trial-storage:/app/.storage
    # Loopback only: the host nginx fronts it at https://trial.adlink4.com/api.
    ports:
      - "127.0.0.1:3100:3000"
    # Readiness probe (same convention as the api service in infra/compose.yaml):
    # Node 22's built-in fetch against the port the API listens on — no curl/wget
    # in the image. A 2xx response exits 0 (healthy); a non-2xx or a connection
    # error exits 1 (unhealthy). An unhealthy status is a signal only: it does not
    # restart the container (restart is on process exit).
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    security_opt: [no-new-privileges:true]

volumes:
  trial-pgdata:
  trial-redisdata:
  trial-storage:
