# Real push for the Trial (ADR 0058) — the Trial's twin of compose.push.yaml,
# layered last and only once the service-account file is on the host
# (docs/push-notifications-runbook.md):
#
#   docker compose -p institution-trial -f infra/compose.trial.yaml \
#     -f infra/compose.trial.environment.yaml [-f <image override>] \
#     -f infra/compose.trial.push.yaml --env-file infra/env/trial.env up -d --no-deps trial-api
#
# FCM_SERVICE_ACCOUNT_FILE (in trial.env) is the HOST path of the JSON key, owned
# by uid 1000 (the image's `node` user), mode 0400, inside a root-only (0700)
# directory — on this host uid 1000 is also the `ubuntu` login, which must not
# read it. It is mounted read-only.
services:
  trial-api:
    environment:
      PUSH_PROVIDER: fcm
      FCM_CREDENTIALS_FILE: /run/secrets/fcm-service-account.json
    volumes:
      - ${FCM_SERVICE_ACCOUNT_FILE:?the host path of the FCM service-account JSON}:/run/secrets/fcm-service-account.json:ro
