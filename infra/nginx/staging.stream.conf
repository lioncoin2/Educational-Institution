# nginx stream (L4) config for staging (P7.3 / D1, design §5 layers 1 + 2b).
# Included inside a top-level stream{} context (install-nginx-staging.sh adds the
# stream{} block to nginx.conf and symlinks this file into stream-enabled/).
#
# One public IP, one public 443, two different TLS services (HTTPS/WSS and
# TURN/TLS) told apart by SNI — resolved here with ssl_preread, no Caddy L4 (D1).

# SNI → inner loopback upstream. TURN's hostname goes to the TURN/TLS terminator;
# everything else to the HTTPS/WSS vhosts.
map $ssl_preread_server_name $upstream {
    turn-staging.adlink4.com  127.0.0.1:8444;
    default                   127.0.0.1:8443;
}

# Layer 1 — public 443. Read SNI without terminating TLS, then forward the raw
# TLS stream to the right loopback service, prefixed with a PROXY header so the
# inner service learns the real client address. The listen has NO proxy_protocol
# (clients speak plain TLS); `proxy_protocol on` is the SEND side.
server {
    listen 443 reuseport;
    ssl_preread on;
    proxy_pass $upstream;
    proxy_protocol on;
    proxy_timeout 300s;
}

# Layer 2b — TURN/TLS terminator. Terminate the TURN client's TLS here (nginx
# holds the cert; LiveKit under external_tls holds none), trust the client IP the
# layer-1 PROXY header carries, and forward the decrypted TURN stream to LiveKit
# on 127.0.0.1:5349 — again with a PROXY header, because LiveKit would otherwise
# see a loopback source and Firefox would reject the allocation (design §5).
server {
    listen 127.0.0.1:8444 ssl proxy_protocol;
    ssl_certificate     /etc/letsencrypt/live/staging-adlink4/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-adlink4/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    set_real_ip_from 127.0.0.1;
    proxy_pass 127.0.0.1:5349;
    proxy_protocol on;
    proxy_timeout 300s;
}
