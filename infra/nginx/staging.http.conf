# nginx HTTP vhosts for staging (P7.3 / D1, design §5 layer 2a). Included inside
# the http{} context (symlinked into sites-enabled by install-nginx-staging.sh).
#
# Public TLS is NOT terminated here: the stream{} layer owns public 443, reads
# SNI without decrypting (ssl_preread) and forwards — over loopback, wrapped in
# PROXY protocol — to 127.0.0.1:8443 (these vhosts) or 127.0.0.1:8444 (TURN/TLS).
# So these servers listen on loopback:8443 with `proxy_protocol`, terminate TLS,
# and trust the client IP the PROXY header carries (set_real_ip_from 127.0.0.1).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Port 80: ACME HTTP-01 (certbot renewals) and a redirect to HTTPS. Must keep
# serving /.well-known/acme-challenge so the scheduled renewal keeps working.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name api-staging.adlink4.com livekit-staging.adlink4.com turn-staging.adlink4.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# Unknown SNI reaching 8443: drop the connection.
server {
    listen 127.0.0.1:8443 ssl http2 default_server proxy_protocol;
    server_name _;
    ssl_certificate     /etc/letsencrypt/live/staging-adlink4/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-adlink4/privkey.pem;
    return 444;
}

# api-staging → the API on loopback 3000 (HTTPS + the /realtime WebSocket).
server {
    listen 127.0.0.1:8443 ssl http2 proxy_protocol;
    server_name api-staging.adlink4.com;

    ssl_certificate     /etc/letsencrypt/live/staging-adlink4/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-adlink4/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_protocol_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}

# livekit-staging → LiveKit signalling on loopback 7880 (WebSocket + room API).
server {
    listen 127.0.0.1:8443 ssl http2 proxy_protocol;
    server_name livekit-staging.adlink4.com;

    ssl_certificate     /etc/letsencrypt/live/staging-adlink4/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-adlink4/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_protocol_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}
