# Browser security headers for the web Trial (https://trial.adlink4.com) — PROPOSED,
# not yet applied: applying it is a gated deployment step (docs/trial-remediation-2026-10.md §8).
#
# `include` it inside BOTH `location /api/` and `location /` of the Trial's server block:
# nginx drops every inherited add_header as soon as a location declares one of its own.
# Pair it with `server_tokens off;` (server level) and, in `location /api/`,
# `proxy_hide_header X-Powered-By;`. In `location /` add:
#     add_header Cache-Control "no-cache" always;
# Flutter's web build does not content-hash its file names (main.dart.js, canvaskit/*),
# so every file revalidates (ETag) and a release never serves a mix of two builds.
#
# The policy was tested against the deployed build (main.dart.js sha256 8487849a…) served
# with exactly these headers from a local nginx 1.24, in headless Chrome 155 (390×844):
# 12 signed-out routes booted, a same-origin API call and the /api/realtime WebSocket
# succeeded, 0 CSP violations. A stricter policy was measured too: without
# 'wasm-unsafe-eval' CanvasKit cannot compile (the app does not boot); without
# style-src 'unsafe-inline' the engine's own <style> element (main.dart.js) and the
# <body style> of web/index.html are refused. script-src stays without 'unsafe-inline'
# and 'unsafe-eval': injected script cannot run.
#
# connect-src names the realtime origin explicitly (wss:). Enabling real LiveKit media on
# the Trial would add its signalling host here, and is a separate decision (ADR 0037).
# https://fonts.gstatic.com is the Flutter engine's font-fallback source (main.dart.js
# fetches glyphs the bundled Almarai/PlexArabic/AmiriQuran fonts lack — emoji, other
# scripts — from fonts.gstatic.com/s/); without it such text renders as boxes. Serving
# those fonts from the Trial itself (`fontFallbackBaseUrl` in web/flutter_bootstrap.js)
# would remove this third-party origin — an app change, not made here.
# HSTS cannot be withdrawn from a browser that has seen it: start at one day, raise to a
# year (31536000) once a week of the Trial on these headers has passed without incident.
add_header Strict-Transport-Security "max-age=86400" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=(), microphone=(self), display-capture=(self)" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' wss://trial.adlink4.com https://fonts.gstatic.com; worker-src 'self' blob:; media-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
